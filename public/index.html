<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adwaith's Movie System</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 30px; background: #141414; color: white; }
        h1 { text-align: center; color: #f5c518; }
        .search-box { max-width: 600px; margin: 30px auto; display: flex; gap: 10px; }
        input { flex: 1; padding: 13px; border: none; border-radius: 5px; }
        button { padding: 13px 20px; background: #f5c518; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d4a900; }
        .movies { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .movie-card { background: #242424; padding: 20px; border-radius: 10px; border: 1px solid #444; }
        .movie-card h2 { color: #f5c518; }
        .movie-card p { color: #ddd; line-height: 1.6; }
        #message { text-align: center; margin: 20px; color: #f5c518; }
        .all-btn { display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>🎬 Adwaith's Movie Database</h1>
    <div class="search-box">
        <input type="text" id="movieName" placeholder="Enter movie name...">
        <button onclick="searchMovie()">Search</button>
    </div>
    <button class="all-btn" onclick="fetchMovies()">Show All Movies</button>
    <h3 id="message">Loading movies...</h3>
    <div class="movies" id="movieList"></div>

    <script>
        const movieList = document.getElementById("movieList");
        const message = document.getElementById("message");

        function displayMovies(movies) {
            movieList.innerHTML = "";
            if (!movies || movies.length === 0) {
                message.innerText = "No movies found";
                return;
            }
            message.innerText = movies.length + " Movie(s) Found";

            movies.forEach(movie => {
                const card = document.createElement("div");
                card.className = "movie-card";

                const title = document.createElement("h2");
                title.textContent = movie.name;

                const details = document.createElement("p");
                details.textContent = "Director: " + movie.director + " | Year: " + movie.year + " | Genre: " + movie.genre + " | Rating: " + movie.rating + " | Language: " + movie.language;

                const description = document.createElement("p");
                description.textContent = movie.description;

                card.appendChild(title);
                card.appendChild(details);
                card.appendChild(description);

                movieList.appendChild(card);
            });
        }

        async function fetchMovies() {
            try {
                message.innerText = "Fetching movies...";
                const response = await fetch("/api/movies");
                const result = await response.json();
                if (!response.ok) throw new Error(result.message);
                displayMovies(result.data);
            } catch (error) {
                message.innerText = error.message;
            }
        }

        async function searchMovie() {
            const name = document.getElementById("movieName").value.trim();
            if (!name) {
                message.innerText = "Please enter a movie name";
                return;
            }
            try {
                message.innerText = "Searching movie...";
                const response = await fetch("/api/movies/search/" + encodeURIComponent(name));
                const result = await response.json();
                if (!response.ok) throw new Error(result.message);
                displayMovies([result.data]);
            } catch (error) {
                movieList.innerHTML = "";
                message.innerText = error.message;
            }
        }

        fetchMovies();
    </script>
</body>
</html>
